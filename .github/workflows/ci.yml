name: AETHER verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: aether
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv && .venv/bin/pip install -r backend/requirements.lock
      - run: .venv/bin/ruff check backend scripts && .venv/bin/ruff format --check backend scripts
      - run: .venv/bin/python -m pytest -q
      - name: Verify PostgreSQL migration and idempotent seed
        env:
          DATABASE_URL: postgresql://postgres:test-only@localhost:5432/aether
          PYTHONPATH: backend
        run: |
          .venv/bin/python scripts/database.py
          .venv/bin/python scripts/database.py
          .venv/bin/python scripts/verify_database.py
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run lint && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: frontend/test-results/
